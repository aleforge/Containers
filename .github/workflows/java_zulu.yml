name: Java Zulu

on:
  push:
    branches:
      - main
    paths:
      - Java/zulu/**
      - Java/entrypoint.sh
      - Java/distrust-emudhra.sh
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  push:
    name: "AleForge-${{ matrix.tag }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "8"
            variant: jdk
            tag: zulu-8
          - version: "8"
            variant: jre
            tag: zulu-8-jre
          - version: "11"
            variant: jdk
            tag: zulu-11
          - version: "11"
            variant: jre
            tag: zulu-11-jre
          - version: "17"
            variant: jdk
            tag: zulu-17
          - version: "17"
            variant: jre
            tag: zulu-17-jre
          - version: "21"
            variant: jdk
            tag: zulu-21
          - version: "21"
            variant: jre
            tag: zulu-21-jre
          - version: "25"
            variant: jdk
            tag: zulu-25
          - version: "25"
            variant: jre
            tag: zulu-25-jre
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./Java
          file: ./Java/zulu/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            JAVA_VERSION=${{ matrix.version }}
            JAVA_VARIANT=${{ matrix.variant }}
          tags: |
            ghcr.io/aleforge/containers:${{ matrix.tag }}
