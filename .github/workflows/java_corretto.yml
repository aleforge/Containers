name: Java Corretto

on:
  push:
    branches:
      - main
    paths:
      - Java/corretto/**
      - Java/entrypoint.sh
      - Java/distrust-emudhra.sh
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  push:
    name: "AleForge-Corretto-${{ matrix.version }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version:
          - 8
          - 11
          - 17
          - 21
          - 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./Java
          file: ./Java/corretto/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            JAVA_VERSION=${{ matrix.version }}
          tags: |
            ghcr.io/aleforge/containers:corretto-${{ matrix.version }}
